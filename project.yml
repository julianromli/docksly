name: Docksly
options:
  bundleIdPrefix: app.docksly
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en
packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 3.1.0
settings:
  base:
    MARKETING_VERSION: 1.1.0
    CURRENT_PROJECT_VERSION: 3
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    SWIFT_STRICT_CONCURRENCY: minimal
targets:
  Docksly:
    type: application
    platform: macOS
    sources:
      - path: Docksly
        excludes:
          - "**/.DS_Store"
    dependencies:
      - package: KeyboardShortcuts
    settings:
      base:
        PRODUCT_NAME: Docksly
        PRODUCT_BUNDLE_IDENTIFIER: app.docksly.Docksly
        INFOPLIST_FILE: Docksly/Info.plist
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_ENTITLEMENTS: Docksly/Docksly.entitlements
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS:
          - "@executable_path/../Frameworks"
        ALWAYS_SEARCH_USER_PATHS: NO
        CLANG_ENABLE_MODULES: YES
        CLANG_ENABLE_OBJC_ARC: YES
        ENABLE_PREVIEWS: YES
        SUPPORTED_PLATFORMS: macosx
        SDKROOT: macosx
        SWIFT_EMIT_LOC_STRINGS: YES
    entitlements:
      path: Docksly/Docksly.entitlements
  DockslyTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: DockslyTests
    dependencies:
      - target: Docksly
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.docksly.DockslyTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Docksly.app/Contents/MacOS/Docksly"
        BUNDLE_LOADER: "$(TEST_HOST)"
